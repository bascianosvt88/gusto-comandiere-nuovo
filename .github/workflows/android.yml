name: Build Gusto Comandiere APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compila APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica archivio Android
        run: |
          test -f GustoComandiereAndroid.zip
          unzip -l GustoComandiereAndroid.zip

      - name: Estrai progetto Android
        run: |
          mkdir -p android-progetto
          unzip -q GustoComandiereAndroid.zip -d android-progetto
          GRADLE_DIR="android-progetto/GustoComandiereAndroid"
          if [ ! -f "$GRADLE_DIR/settings.gradle" ] && [ ! -f "$GRADLE_DIR/settings.gradle.kts" ]; then
            echo "ERRORE: non trovo settings.gradle nel percorso: $GRADLE_DIR"
            find android-progetto -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "Progetto Gradle trovato in: $GRADLE_DIR"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: gradle assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: gusto-comandiere-apk
          path: android-progetto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
