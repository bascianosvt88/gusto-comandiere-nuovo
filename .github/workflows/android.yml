
name: Build Gusto Comandiere APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principale

permissions:
  contents: read

jobs:
  build:
    name: Compila APK Gusto Comandiere
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository GitHub
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica file necessari
        run: |
          test -f GustoComandiereAndroid.zip
          test -f gusto-comandiere-nuovo.html

          echo "Archivio Android:"
          ls -lh GustoComandiereAndroid.zip

          echo "Nuovo HTML:"
          ls -lh gusto-comandiere-nuovo.html

      - name: Estrai progetto Android
        run: |
          mkdir -p android-progetto

          unzip -q GustoComandiereAndroid.zip -d android-progetto

          GRADLE_DIR="android-progetto/GustoComandiereAndroid"

          test -f "$GRADLE_DIR/settings.gradle"
          test -f "$GRADLE_DIR/app/build.gradle"
          test -f "$GRADLE_DIR/app/src/main/AndroidManifest.xml"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          echo "Progetto Android individuato correttamente."

      - name: Verifica collegamento stampa Android
        run: |
          JAVA_FILE="android-progetto/GustoComandiereAndroid/app/src/main/java/it/gusto/comandiere/MainActivity.java"

          test -f "$JAVA_FILE"

          if ! grep -q "GustoCleanter" "$JAVA_FILE"; then
            echo "ERRORE: collegamento GustoCleanter non trovato."
            exit 1
          fi

          echo "Collegamento alla stampa presente."

      - name: Aggiorna HTML del Comandiere
        run: |
          DEST="android-progetto/GustoComandiereAndroid/app/src/main/assets/index.html"

          test -f "$DEST"

          cp gusto-comandiere-nuovo.html "$DEST"

          if ! cmp -s gusto-comandiere-nuovo.html "$DEST"; then
            echo "ERRORE: HTML non sostituito correttamente."
            exit 1
          fi

          echo "HTML aggiornato correttamente."
          sha256sum "$DEST"
          wc -c "$DEST"

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa componenti Android
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          gradle assembleDebug

      - name: Verifica APK generata
        run: |
          APK="android-progetto/GustoComandiereAndroid/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK compilata:"
          ls -lh "$APK"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: Gusto-Comandiere-APK
          path: android-progetto/GustoComandiereAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
