
name: Build Gusto Comandiere APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compila APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica archivio e nuovo HTML
        run: |
          test -f GustoComandiereAndroid.zip
          test -f Comandiere_Gusto_nuovo.html
          unzip -l GustoComandiereAndroid.zip

      - name: Estrai progetto Android
        run: |
          mkdir -p android-progetto
          unzip -q GustoComandiereAndroid.zip -d android-progetto

          GRADLE_DIR="android-progetto/GustoComandiereAndroid"

          if [ ! -f "$GRADLE_DIR/settings.gradle" ] && \
             [ ! -f "$GRADLE_DIR/settings.gradle.kts" ]; then
            echo "ERRORE: progetto Gradle non trovato"
            find android-progetto -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Sostituisci tutti gli HTML Android
        run: |
          GRADLE_DIR="android-progetto/GustoComandiereAndroid"

          mapfile -t FILES < <(
            find "$GRADLE_DIR" -type f \
            -path '*/src/main/assets/index.html'
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERRORE: nessun index.html trovato"
            exit 1
          fi

          echo "Trovati ${#FILES[@]} file index.html"

          for DEST in "${FILES[@]}"; do
            echo "Aggiorno: $DEST"
            cp Comandiere_Gusto_nuovo.html "$DEST"

            if ! cmp -s Comandiere_Gusto_nuovo.html "$DEST"; then
              echo "ERRORE: verifica sostituzione fallita"
              exit 1
            fi
          done

          echo "Tutti i file index.html sono stati aggiornati."

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: gradle assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: gusto-comandiere-apk
          path: android-progetto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
