name: Build Gusto Comandiere APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compila APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verifica archivio Android
        run: |
          test -f GustoComandiereAndroid.zip
          unzip -l GustoComandiereAndroid.zip

      - name: Estrai progetto Android
        run: |
          mkdir -p android-progetto
          unzip -q GustoComandiereAndroid.zip -d android-progetto
          find android-progetto -name settings.gradle -o -name settings.gradle.kts

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: android-progetto
        run: gradle assembleDebug

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: gusto-comandiere-apk
          path: android-progetto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
